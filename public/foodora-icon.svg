<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="foodoraGrad" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2B85" />
      <stop offset="55%" stop-color="#E21B70" />
      <stop offset="100%" stop-color="#B80E57" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7A0738" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#foodoraGrad)" />
  <rect x="6" y="6" width="116" height="116" rx="28" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Subtle Inner Shine -->
  <path d="M22 14C44 10 84 10 106 14" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Stylized Cloche & Cutlery Mark -->
