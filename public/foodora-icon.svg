    <path d="M28 74C28 53.5 44.1 38 64 38C83.9 38 100 53.5 100 74H28Z" fill="#FFFFFF" />
    <!-- Accent Flame / Leaf Cutout inside Cloche -->
    <path d="M64 47C57.5 53 55 59 55 64C55 68.5 59 71.5 64 71.5C69 71.5 73 68.5 73 64C73 59 70.5 53 64 47ZM64 67.5C61.5 67.5 59.8 65.8 59.8 63.5C59.8 61.1 61.5 58 64 55.2C66.5 58 68.2 61.1 68.2 63.5C68.2 65.8 66.5 67.5 64 67.5Z" fill="#E21B70" />
    <!-- Serving Platter Base -->
    <rect x="22" y="79" width="84" height="9" rx="4.5" fill="#FFFFFF" />
    <!-- BD Accent Speed Lines -->
    <rect x="34" y="94" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.85)" />
  </g>
</svg>
